name: emergency_app
description: Emergency contacts app
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Существующие
  intl: ^0.19.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.2
  vibration: ^2.0.0
  cupertino_icons: ^1.0.8
  share_plus: ^10.1.3
  
  # Новые
  supabase_flutter: ^2.8.0
  onesignal_flutter: ^5.2.7
  flutter_svg: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^0.3.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/Guardians_icon3.png"